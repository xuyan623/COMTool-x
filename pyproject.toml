[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "comtool-x"
version = "0.1.0"
description = "Native Qt visual plugin workbench for communication and instrumentation"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "numpy==2.5.4",
    "pyqtgraph==0.14.0",
    "pyserial==3.5",
    "paramiko==5.1.0",
    "pyte==0.8.2",
]

[project.scripts]
comtool-x = "comtoolx.app:main"

[dependency-groups]
build = ["pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
include = ["comtoolx*"]

[tool.setuptools.package-data]
comtoolx = ["assets/*"]
